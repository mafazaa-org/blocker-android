name: Build & Upload to Firebase App Distribution

on:
  push:
    branches:
      - feature/gh-action
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK (use Java 17 for AGP 8+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Enable Gradle caching (faster builds)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      # 4️⃣ Inject google-services.json securely
      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          echo "✅ google-services.json added successfully"


      # 4️⃣ Make gradlew executable (if not already)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5️⃣ Build release APK (or AAB if preferred)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # If you prefer AAB, replace with:
      # - name: Build Release AAB
      #   run: ./gradlew bundleRelease

      # 6️⃣ Upload to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: karamelmannai@gmail.com
          file: app/build/outputs/apk/release/app-release.apk
