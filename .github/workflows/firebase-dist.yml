name: Build & Upload Release to Firebase App Distribution

on:
  push:
    branches:
      - test
      - feature/gh-action
  pull_request:
    branches:
      - test
      - feature/gh-action
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Enable Gradle caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      # 4️⃣ Inject google-services.json
      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          echo "✅ google-services.json added successfully"

      # 5️⃣ Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 6️⃣ Build Release AAB (Recommended for best practice)
      # Building an AAB is the modern Google-recommended method for distribution.
      - name: Build Release AAB
        run: ./gradlew bundleRelease -x lintVitalRelease

      # 7️⃣ Find the Release AAB
      - name: Find Release AAB
        id: find_aab
        run: |
          aab_path=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "aab_path=$aab_path" >> $GITHUB_OUTPUT
          echo "✅ Found Release AAB at: $aab_path"

      # 8️⃣ Upload Release AAB to Firebase App Distribution
      - name: Upload Release AAB to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: qa-testers
          # Changed file output to use the AAB path
          file: ${{ steps.find_aab.outputs.aab_path }}
